[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinynav"
version = "0.0.9"
description = "CLI for TinyNav"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "UniflexAI" }]
dependencies = [
  "rich>=13.9.0",
  "tyro>=0.8.14",
]

[project.scripts]
tinynav = "tinynav_cli.cli:main"

[project.urls]
Homepage = "https://github.com/UniflexAI/tinynav-cli"
Repository = "https://github.com/UniflexAI/tinynav-cli"
Issues = "https://github.com/UniflexAI/tinynav-cli/issues"

[dependency-groups]
dev = [
  "build",
  "pytest",
  "ruff",
  "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinynav_cli"]
